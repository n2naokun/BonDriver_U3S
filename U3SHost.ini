[Card]
; U3Sの内蔵カードリーダーを使う場合の設定です。変更後は U3SHost.exe を再起動します。
; 複数台で同時に受信していても、内蔵カード1枚を共有できます。
; 受信に使うチューナーと、復号に使うカードは個別に割り当てられます。
; CardSharingMode に以下のいずれかを指定します。
; Single: 使用中の1枚を共有。上限に達すると新規接続は失敗します。
; Fill: 使用中のカードを上限まで共有し、次の接続から別のカードを使います。
; Balance: 同時接続数が最も少ないカードを優先します。
CardSharingMode=Single

; カード1枚あたりの同時 SCardConnect 接続数の上限です。0 は上限なし、3 なら最大3接続です。
; 例: 1枚につき3接続まで受け付け、4件目を別のカードに割り当てるなら Fill と 3 を指定します。
MaxConnectionsPerCard=0
