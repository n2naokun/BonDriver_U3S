[CHANNEL]
; BS・110度CSの選局表です。地デジはTVTestのチャンネルスキャンで登録します。
; 複数台を同時に受信する場合は、同時受信する台数分のDLLとINIを用意します。
; 例: BonDriver_U3S_2.dll と BonDriver_U3S_2.ini のように、ペアごとにベース名を揃えます。
; Hostは受信要求ごとに空いているチューナーを割り当てます。各台は同じ受信構成で接続します。
; 列は半角タブ区切り、数値は十進数。空間とチャンネル番号はそれぞれ 0 からの連番です。
; 空間宣言の列は $表示名、空間番号。
$BS	0
$CS110	1

; 選局行の列は 表示名、空間番号、チャンネル番号、周波数番号、TSID。
; BS の周波数番号は 0〜11（BS01〜BS23 の奇数）、110 度 CS は 12〜23（ND02〜ND24 の偶数）。
; 衛星のTSIDは1〜65519を指定します。
; チャンネルは空間ごとに並べます。追加時はその空間の次のチャンネル番号を使い、削除時は欠番を詰めます。
; 実際の変更は選局行の値を編集します。行頭の ; はコメントです。
; 保存後にTVTestでBonDriverを開き直し、変更した空間を再スキャンします。
; 2026-11-26 の EDCB 選局設定と ProxyExD の U3S 用 INI を照合。
